# web-training.power-knowledge.tech —— 从 0 到上线 · 网站建设实训课
#
# 形态：零构建多页静态站。仓库的 site/ 目录就是发布产物，落在 /var/www/web-training。
# 不是 SPA：不存在的路径必须真 404，不能回落 index.html ——
#   回落会让错误地址返回 200 + 首页内容，既误导访客也让搜索引擎收录垃圾页。
#
# 对外只认 www：裸域 301 归一。canonical / sitemap / og:url 里写的都是 www。
# 证书单独签发（web-training.power-knowledge.tech）：www.web-training.* 是二级子域，
#   通配符 *.power-knowledge.tech 只覆盖一级，盖不到它。

# ── 80：仅 ACME 挑战 + 跳 HTTPS ──────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name web-training.power-knowledge.tech www.web-training.power-knowledge.tech;

    include snippets/acme.conf;

    access_log /var/log/nginx/web-training.access.log;
    error_log  /var/log/nginx/web-training.error.log;

    location / {
        return 301 https://www.web-training.power-knowledge.tech$request_uri;
    }
}

# ── 443：裸域 301 到 www ────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name web-training.power-knowledge.tech;

    ssl_certificate     /etc/letsencrypt/live/web-training.power-knowledge.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/web-training.power-knowledge.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;

    # 续期时 LE 会经 HTTPS 取挑战文件，443 块没有这个路径就 404 → 续期失败
    include snippets/acme.conf;

    return 301 https://www.web-training.power-knowledge.tech$request_uri;
}

# ── 443：主站（www）──────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.web-training.power-knowledge.tech;

    ssl_certificate     /etc/letsencrypt/live/web-training.power-knowledge.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/web-training.power-knowledge.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;

    include snippets/acme.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/web-training;
    index index.html;

    # 隐藏文件防护：与站群其余五站共用同一份 snippet。
    # 本站 web 根下有 .deployed-version 版本哨兵（入口站的 /api/version/web-training
    # 端点读它）。没有这条规则时公网可直接下载 —— 2026-10-31 实测该路径返回 200，
    # 而其余五站均为 403。顺带挡住扫描器对 /.env、/.git/config 的探测。
    # ⚠ 必须排在下面那几条正则 location（\.(css|js)$ 等）**之前**：
    #   nginx 的正则 location 按出现顺序匹配，后置会被先到的规则抢走。
    include snippets/security-hardening.conf;

    access_log /var/log/nginx/web-training.access.log;
    error_log  /var/log/nginx/web-training.error.log;

    gzip on;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_vary on;

    # 真 404：交给 /404.html，且该地址不允许被外部直接当作正常页访问
    error_page 404 /404.html;
    location = /404.html { internal; }

    # HTML 一律回源校验：内容更新不改文件名，长缓存会把旧页面锁在用户浏览器里。
    # ⚠ nginx 陷阱：location 里只要出现一个 add_header，server 块里的就不再生效 ——
    #   故 HSTS 与 nosniff 必须在每个带 add_header 的 location 里重复一遍。
    location / {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # 静态资源：同样回源校验（文件名不带内容哈希，不能给长缓存）。
    # 图片给一天：它们几乎不变，且省一次往返。
    location ~* \.(css|js)$ {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location ~* \.(svg|png|jpg|jpeg|webp|ico|woff2)$ {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }
}
